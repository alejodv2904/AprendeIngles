<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>

<body>
<title>Paso a Paso English</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Paso a Paso">
<meta name="theme-color" content="#F4F6FB">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Lexend:wght@400;500;600&display=swap">
<style>
/* Layout: one-column phone app shell (max 520px), winding lesson path, bottom tab bar, full-screen lesson overlay */
:root {
  --bg: #F4F6FB; --surface: #FFFFFF; --sunk: #EAEEF7; --ink: #18203A; --muted: #5E6784; --line: #DCE1EE;
  --accent: #2F5BEA; --accent-ink: #FFFFFF;
  --good: #138A50; --good-bg: #DDF6E8; --bad: #C9343A; --bad-bg: #FDE3E3;
  --flame: #EA5A22; --gold: #D99800; --heart: #E5484D;
  --locked: #CDD3E1; --locked-ink: #8790A8;
  --shadow: rgba(24, 32, 58, .14);
  --f-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body: "Lexend", -apple-system, "Segoe UI", system-ui, sans-serif;
  --r: 16px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1322; --surface: #171F36; --sunk: #11182C; --ink: #E8ECF8; --muted: #9AA3C0; --line: #2A3454;
  --accent: #7B93FF; --accent-ink: #0B1020;
  --good: #47D18C; --good-bg: #10301F; --bad: #FF7479; --bad-bg: #3A171A;
  --flame: #FF8650; --gold: #FFC531; --heart: #FF6B70;
  --locked: #2B3452; --locked-ink: #6F7899; --shadow: rgba(0,0,0,.45); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0E1322; --surface: #171F36; --sunk: #11182C; --ink: #E8ECF8; --muted: #9AA3C0; --line: #2A3454;
  --accent: #7B93FF; --accent-ink: #0B1020;
  --good: #47D18C; --good-bg: #10301F; --bad: #FF7479; --bad-bg: #3A171A;
  --flame: #FF8650; --gold: #FFC531; --heart: #FF6B70;
  --locked: #2B3452; --locked-ink: #6F7899; --shadow: rgba(0,0,0,.45); color-scheme: dark }

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 10px; }
.wrap { max-width: 520px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 2px solid var(--line); }
.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px; }
.brand { font-family: var(--f-display); font-weight: 800; font-size: 20px; letter-spacing: -.02em; }
.brand span { color: var(--accent); }
.stats { display: flex; gap: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
.stat { display: inline-flex; align-items: center; gap: 4px; }
.stat svg { width: 22px; height: 22px; }
.stat.flame { color: var(--flame); } .stat.bolt { color: var(--gold); }
.stat.off { color: var(--locked-ink); }

main { padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
.view { padding-block: 18px; }

/* goal strip */
.goal { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 2px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.goal-txt { flex: 1; min-width: 0; font-size: 14px; color: var(--muted); }
.goal-txt b { color: var(--ink); display: block; font-size: 15px; }
.bar { height: 12px; background: var(--sunk); border-radius: 99px; overflow: hidden; margin-top: 6px; }
.bar i { display: block; height: 100%; background: var(--gold); border-radius: 99px; transition: width .4s ease; }

/* path */
.unit { margin-top: 26px; }
.unit-head { background: var(--u); color: #fff; border-radius: var(--r); padding: 14px 16px; display: flex; align-items: center; gap: 12px; box-shadow: 0 4px 0 color-mix(in srgb, var(--u) 70%, #000); }
.unit-head > div { flex: 1; min-width: 0; }
.unit-head small { text-transform: uppercase; letter-spacing: .08em; font-size: 12px; opacity: .85; font-weight: 600; }
.unit-head h2 { margin: 2px 0 0; font-family: var(--f-display); font-weight: 800; font-size: 22px; line-height: 1.15; text-wrap: balance; }
.unit-head p { margin: 2px 0 0; font-size: 14px; opacity: .92; }
.guide-btn { flex: none; border: 2px solid rgba(255,255,255,.55); border-radius: 12px; padding: 8px 10px; font-size: 13px; font-weight: 600; color: #fff; }
.guide-btn:hover { background: rgba(255,255,255,.14); }
.nodes { display: flex; flex-direction: column; align-items: center; gap: 22px; padding-block: 34px 4px; }
.node { position: relative; width: 74px; height: 70px; border-radius: 50%; background: var(--u); color: #fff; box-shadow: 0 7px 0 color-mix(in srgb, var(--u) 68%, #000); display: grid; place-items: center; transition: transform .08s; }
.node:active { transform: translateY(5px); box-shadow: 0 2px 0 color-mix(in srgb, var(--u) 68%, #000); }
.node svg { width: 32px; height: 32px; }
.node.locked { background: var(--locked); color: var(--locked-ink); box-shadow: 0 7px 0 color-mix(in srgb, var(--locked) 75%, #000); }
.node.current::after { content: ""; position: absolute; inset: -10px; border-radius: 50%; border: 4px solid var(--u); opacity: .35; animation: ring 1.8s ease-out infinite; }
.node .tag { position: absolute; top: -34px; left: 50%; transform: translateX(-50%); background: var(--surface); color: var(--u); border: 2px solid var(--line); font-weight: 600; font-size: 12px; letter-spacing: .06em; padding: 3px 10px; border-radius: 10px; white-space: nowrap; }
.node .times { position: absolute; bottom: -6px; right: -6px; background: var(--gold); color: #2A1E00; font-size: 11px; font-weight: 600; border-radius: 99px; padding: 1px 7px; border: 2px solid var(--bg); }
@keyframes ring { from { transform: scale(.9); opacity: .5 } to { transform: scale(1.25); opacity: 0 } }
.node-label { font-size: 13px; color: var(--muted); margin-top: -10px; font-weight: 500; }
.node-wrap { display: flex; flex-direction: column; align-items: center; gap: 14px; }

/* cards */
h1.h { font-family: var(--f-display); font-weight: 800; font-size: 28px; margin: 6px 0 4px; letter-spacing: -.02em; }
.sub { color: var(--muted); margin: 0 0 16px; }
.cards { display: grid; gap: 12px; }
.card { background: var(--surface); border: 2px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; align-items: center; gap: 14px; text-align: left; width: 100%; box-shadow: 0 4px 0 var(--line); }
button.card:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.card .ic { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; flex: none; color: #fff; }
.card .ic svg { width: 26px; height: 26px; }
.card b { display: block; font-size: 17px; }
.card span { color: var(--muted); font-size: 14px; }
.card > div { min-width: 0; flex: 1; }
.card[disabled] { opacity: .55; cursor: default; }
.section-t { font-family: var(--f-display); font-weight: 800; font-size: 20px; margin: 28px 0 10px; }
.words { background: var(--surface); border: 2px solid var(--line); border-radius: var(--r); overflow: hidden; }
.words h3 { margin: 0; padding: 10px 14px; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); background: var(--sunk); }
.word { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-top: 1px solid var(--line); }
.word .emo { font-size: 22px; width: 30px; text-align: center; }
.word .en { font-weight: 600; flex: 1; min-width: 0; }
.word .es { color: var(--muted); text-align: right; min-width: 0; }
.spk { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: var(--accent); flex: none; }
.spk:hover { background: var(--sunk); }
.spk svg { width: 20px; height: 20px; }

/* profile */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile { background: var(--surface); border: 2px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; gap: 10px; align-items: center; }
.tile svg { width: 28px; height: 28px; flex: none; }
.tile b { display: block; font-size: 22px; font-family: var(--f-display); font-variant-numeric: tabular-nums; line-height: 1.1; }
.tile span { font-size: 13px; color: var(--muted); }
.week { background: var(--surface); border: 2px solid var(--line); border-radius: var(--r); padding: 16px 14px 12px; }
.chart { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; align-items: end; height: 150px; position: relative; }
.col { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 4px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.col i { width: 100%; max-width: 34px; background: var(--accent); border-radius: 8px 8px 3px 3px; min-height: 3px; }
.col.today i { background: var(--gold); }
.col.today { color: var(--ink); font-weight: 600; }
.goal-line { position: absolute; left: 0; right: 0; border-top: 2px dashed var(--line); }
.goal-line span { position: absolute; right: 0; top: -20px; font-size: 11px; color: var(--muted); background: var(--surface); padding: 0 4px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.seg { display: inline-flex; background: var(--sunk); border-radius: 12px; padding: 3px; gap: 2px; }
.seg button { padding: 6px 10px; border-radius: 9px; font-size: 14px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px var(--shadow); }
.link-danger { color: var(--bad); font-weight: 600; font-size: 15px; }

/* bottom nav */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 2px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.nav .in { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); }
.nav button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 9px 0 10px; font-size: 12px; font-weight: 600; color: var(--muted); }
.nav button svg { width: 26px; height: 26px; }
.nav button.on { color: var(--accent); }

/* buttons */
.btn { display: block; width: 100%; padding: 15px 18px; border-radius: 14px; font-weight: 600; font-size: 16px; text-transform: uppercase; letter-spacing: .06em; background: var(--accent); color: var(--accent-ink); box-shadow: 0 4px 0 color-mix(in srgb, var(--accent) 65%, #000); transition: transform .06s; }
.btn:active:not([disabled]) { transform: translateY(3px); box-shadow: 0 1px 0 color-mix(in srgb, var(--accent) 65%, #000); }
.btn[disabled] { background: var(--locked); color: var(--locked-ink); box-shadow: none; cursor: default; }
.btn.good { background: var(--good); color: #fff; box-shadow: 0 4px 0 color-mix(in srgb, var(--good) 65%, #000); }
.btn.bad { background: var(--bad); color: #fff; box-shadow: 0 4px 0 color-mix(in srgb, var(--bad) 65%, #000); }
.btn.ghost { background: transparent; color: var(--accent); box-shadow: none; border: 2px solid var(--line); }

/* sheet */
.scrim { position: fixed; inset: 0; background: rgba(10, 14, 28, .45); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: 100%; max-width: 520px; border-radius: 22px 22px 0 0; padding: 20px max(16px, env(safe-area-inset-left, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-right, 0px)); max-height: 85%; overflow-y: auto; animation: up .22s ease-out; }
.sheet h3 { font-family: var(--f-display); font-weight: 800; font-size: 22px; margin: 0 0 4px; }
.sheet p { margin: 0 0 16px; color: var(--muted); }
.sheet .acts { display: grid; gap: 10px; margin-top: 16px; }
@keyframes up { from { transform: translateY(40px); opacity: 0 } }

/* lesson */
.lesson { position: fixed; inset: 0; z-index: 30; background: var(--bg); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); }
.lesson > .wrap { width: 100%; }
.l-top { display: flex; align-items: center; gap: 14px; padding-block: 14px; }
.x { width: 36px; height: 36px; display: grid; place-items: center; color: var(--muted); border-radius: 10px; flex: none; }
.x svg { width: 26px; height: 26px; }
.l-top .bar { flex: 1; height: 16px; margin: 0; }
.l-top .bar i { background: var(--good); }
.hearts { display: inline-flex; align-items: center; gap: 4px; color: var(--heart); font-weight: 600; font-variant-numeric: tabular-nums; }
.hearts svg { width: 24px; height: 24px; }
.l-body { flex: 1; overflow-y: auto; }
.l-body .wrap { padding-block: 8px 24px; }
.ex-title { font-family: var(--f-display); font-weight: 800; font-size: 24px; margin: 6px 0 18px; letter-spacing: -.01em; text-wrap: balance; }
.prompt { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
.bubble { border: 2px solid var(--line); background: var(--surface); border-radius: 16px; padding: 12px 16px; font-size: 19px; font-weight: 500; min-width: 0; }
.big-spk { width: 52px; height: 52px; border-radius: 14px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; flex: none; box-shadow: 0 4px 0 color-mix(in srgb, var(--accent) 65%, #000); }
.big-spk svg { width: 28px; height: 28px; }
.listen-row { display: flex; gap: 14px; justify-content: center; align-items: center; margin: 10px 0 26px; }
.listen-row .big-spk { width: 96px; height: 96px; border-radius: 24px; }
.listen-row .big-spk svg { width: 48px; height: 48px; }
.listen-row .slow { width: 64px; height: 64px; border-radius: 18px; background: var(--surface); color: var(--accent); border: 2px solid var(--line); display: grid; place-items: center; font-weight: 600; font-size: 13px; }
.opts { display: grid; gap: 10px; }
.opt { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: 14px 16px; font-size: 17px; box-shadow: 0 3px 0 var(--line); }
.opt .k { width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--line); display: grid; place-items: center; font-size: 13px; color: var(--muted); flex: none; }
.opt.sel { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--surface)); box-shadow: 0 3px 0 var(--accent); }
.opt.ok { border-color: var(--good); background: var(--good-bg); box-shadow: 0 3px 0 var(--good); }
.opt.no { border-color: var(--bad); background: var(--bad-bg); box-shadow: 0 3px 0 var(--bad); }
.pics { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pic { background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 16px 8px 12px; display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 17px; font-weight: 500; box-shadow: 0 3px 0 var(--line); }
.pic .e { font-size: 52px; line-height: 1; }
.pic.sel { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--surface)); box-shadow: 0 3px 0 var(--accent); }
.pic.ok { border-color: var(--good); background: var(--good-bg); }
.pic.no { border-color: var(--bad); background: var(--bad-bg); }
.answer-line { min-height: 112px; border-top: 2px solid var(--line); border-bottom: 2px solid var(--line); padding: 10px 0; display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start; background-image: linear-gradient(transparent 52px, var(--line) 52px, var(--line) 54px, transparent 54px); }
.bank { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 22px; }
.tile-w { background: var(--surface); border: 2px solid var(--line); border-radius: 12px; padding: 8px 13px; font-size: 17px; box-shadow: 0 3px 0 var(--line); }
.tile-w.used { color: transparent; background: var(--sunk); box-shadow: none; pointer-events: none; }
textarea.typed { width: 100%; min-height: 120px; resize: vertical; background: var(--surface); color: var(--ink); border: 2px solid var(--line); border-radius: 14px; padding: 14px; font: inherit; font-size: 18px; }
textarea.typed:focus { outline: none; border-color: var(--accent); }
.blank-s { font-size: 21px; line-height: 2; margin-bottom: 6px; }
.gap { display: inline-block; min-width: 90px; border-bottom: 3px solid var(--accent); text-align: center; font-weight: 600; color: var(--accent); }
.hint { color: var(--muted); font-size: 15px; margin-bottom: 22px; }
.chips { display: flex; flex-wrap: wrap; gap: 10px; }
.match { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.match .opt { justify-content: center; text-align: center; font-size: 16px; padding: 14px 8px; }
.match .opt.done { opacity: .35; pointer-events: none; box-shadow: none; }
.l-foot { border-top: 2px solid var(--line); background: var(--bg); padding-bottom: env(safe-area-inset-bottom, 0px); }
.l-foot .wrap { padding-block: 14px 16px; display: grid; gap: 12px; }
.l-foot.good { background: var(--good-bg); border-color: transparent; }
.l-foot.bad { background: var(--bad-bg); border-color: transparent; }
.fb { display: flex; gap: 12px; align-items: flex-start; }
.fb .badge { width: 44px; height: 44px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; flex: none; }
.fb .badge svg { width: 26px; height: 26px; }
.good .fb { color: var(--good); } .bad .fb { color: var(--bad); }
.fb b { display: block; font-family: var(--f-display); font-size: 21px; font-weight: 800; }
.fb .ans { color: var(--ink); font-size: 16px; }
.fb > div { flex: 1; min-width: 0; }
.skip { font-size: 14px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; padding: 4px; justify-self: center; }

/* end screen */
.end { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 10px; padding-block: 24px; }
.end h2 { font-family: var(--f-display); font-weight: 800; font-size: 32px; margin: 8px 0 0; color: var(--gold); text-wrap: balance; }
.end.fail h2 { color: var(--heart); }
.end p { color: var(--muted); margin: 0; max-width: 32ch; }
.burst { width: 120px; height: 120px; }
.end-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; width: 100%; margin-top: 18px; }
.es-box { border: 2px solid var(--c); border-radius: 14px; overflow: hidden; }
.es-box small { display: block; background: var(--c); color: #fff; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; padding: 4px; }
.es-box b { display: block; font-family: var(--f-display); font-size: 22px; padding: 8px 4px; font-variant-numeric: tabular-nums; }
.pop { animation: pop .4s cubic-bezier(.2, 1.6, .5, 1); }
@keyframes pop { from { transform: scale(.4); opacity: 0 } }
.shake { animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-6px) } 75% { transform: translateX(6px) } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<header class="top">
  <div class="wrap">
    <div class="brand">Paso a Paso <span>English</span></div>
    <div class="stats" id="topStats"></div>
  </div>
</header>
<main><div class="wrap view" id="view"></div></main>
<nav class="nav" aria-label="Secciones">
  <div class="in">
    <button id="tab-learn" data-tab="learn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 2 8.5l10 5.5 8-4.4V16h2V8.5L12 3Zm-6 9.6V16c0 2 2.7 4 6 4s6-2 6-4v-3.4l-6 3.3-6-3.3Z"/></svg>Aprender</button>
    <button id="tab-practice" data-tab="practice"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.6 14.9 22 13.5 20.6 12 17 15.6 8.4 7 12 3.4 10.6 2 9.1 3.4 7.7 2 5.5 4.2 4.1 2.8 2.7 4.2l1.4 1.4L2 7.7l1.4 1.5L2 10.6 3.4 12 7 8.4l8.6 8.6-3.6 3.6 1.4 1.4 1.5-1.4 1.4 1.4 2.1-2.2 1.4 1.4 1.4-1.4-1.4-1.4 2.2-2.1-1.4-1.4 1.4-1.6Z"/></svg>Practicar</button>
    <button id="tab-profile" data-tab="profile"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9Zm0 2c-4.4 0-8 2.2-8 5v2h16v-2c0-2.8-3.6-5-8-5Z"/></svg>Perfil</button>
  </div>

}
function failScreen() {
  $('#lbody').innerHTML = `<div class="wrap end fail"><svg class="burst pop" viewBox="0 0 24 24" aria-hidden="true" style="color:var(--heart)"><path fill="currentColor" d="M12 21.4 10.6 20C5.4 15.4 2 12.3 2 8.5 2 5.4 4.4 3 7.5 3c1.7 0 3.4.8 4.5 2.1A6 6 0 0 1 16.5 3C19.6 3 22 5.4 22 8.5c0 3.8-3.4 6.9-8.6 11.5L12 21.4Z"/></svg>
    <h2>Te quedaste sin vidas</h2><p>Los errores se guardaron en «Repasar errores». Inténtalo otra vez: cada intento te hace más fuerte.</p></div>`;
  $('#lfoot').className = 'l-foot';
  $('#lfoot').innerHTML = `<div class="wrap"><button class="btn" id="retry">Intentar de nuevo</button><button class="btn ghost" id="finish">Salir</button></div>`;
}
function retry() { const m = L.meta; const el = $('#lesson'); el.remove(); L = null; begin(m); }
function begin(meta) {
  if (meta.mode === 'lesson') startLesson(genLesson(NODES[meta.n]), meta);
  else { const q = genPractice(meta.mode); if (q.length) startLesson(q, meta); }
}
function quitAsk() {
  sheet(`<h3>¿Salir de la lección?</h3><p>Si sales ahora perderás el progreso de esta lección.</p><div class="acts"><button class="btn" data-close>Seguir aprendiendo</button><button class="btn ghost" id="quitYes" style="color:var(--bad)">Salir</button></div>`);
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('button, .scrim'); if (!t) return;
  const d = t.dataset;
  if (t.id === 'scrim') { if (e.target === t) closeSheet(); return; }
  if (d.say) { say(d.say); return; }
  if (d.saySlow) { say(d.saySlow, true); return; }
  if (d.tab) { tab = d.tab; render(); window.scrollTo(0, 0); return; }
  if (d.node) return nodeSheet(+d.node);
  if (d.guide) return guideSheet(+d.guide);
  if ('close' in d) return closeSheet();
  if (d.start) return begin({ mode: 'lesson', n: +d.start, id: NODES[+d.start].id });
  if (d.practice) return begin({ mode: d.practice });
  if (d.goal) { S.goal = +d.goal; save(); render(); return; }
  if (d.sound) { S.sound = d.sound === '1'; save(); render(); return; }
  if (t.id === 'resetBtn') return sheet(`<h3>¿Borrar todo el progreso?</h3><p>Se borrarán tu racha, tus XP y las lecciones completadas. No se puede deshacer.</p><div class="acts"><button class="btn ghost" data-close>Cancelar</button><button class="btn bad" id="resetYes">Borrar progreso</button></div>`);
  if (t.id === 'resetYes') { S = Object.assign({}, DEFAULT, { done: {}, daily: {}, mistakes: [] }); save(); closeSheet(); render(); return; }
  if (t.id === 'quit') return quitAsk();
  if (t.id === 'quitYes') { closeSheet(); return endLessonUI(); }
  if (!L) return;
  const ex = cur();
  if (t.id === 'check') return grade();
  if (t.id === 'cont') return next();
  if (t.id === 'finish') return endLessonUI();
  if (t.id === 'retry') return retry();
  if (t.id === 'skipEar') { L.solved++; L.i++; if (L.i >= L.queue.length) return winScreen(); return renderEx(); }
  if (L.checked) return;
  if (d.opt != null) {
    L.sel = +d.opt;
    document.querySelectorAll('#lbody [data-opt]').forEach(b => b.classList.toggle('sel', b === t));
    if (ex.type === 'pick') say(ex.options[L.sel].t);
    if (ex.type === 'mc' && ex.sayOpts) say(ex.options[L.sel]);
    if (ex.type === 'blank') $('#gap').textContent = ex.options[L.sel];
    footer(); return;
  }
  if (d.tile != null) {
    const k = +d.tile;
    if (t.closest('#bank')) { L.built.push(k); t.classList.add('used'); const nb = document.createElement('button'); nb.className = 'tile-w pop'; nb.dataset.tile = k; nb.textContent = ex.tiles[k]; $('#aline').appendChild(nb); if (ex.listen == null && ex.speak == null && canSpeak && /^[\x00-\x7F]+$/.test(ex.tiles[k])) say(ex.tiles[k]); }
    else { L.built = L.built.filter(x => x !== k); t.remove(); const src = $(`#bank [data-tile="${k}"]`); if (src) src.classList.remove('used'); }
    footer(); return;
  }
  if (d.ml != null || d.mr != null) {
    const side = d.ml != null ? 'l' : 'r', k = +(d.ml ?? d.mr);
    if (side === 'l') say(ex.left[k]);
    if (!L.mSel || L.mSel.side === side) { L.mSel = { side, k }; document.querySelectorAll(`#lbody [data-m${side}]`).forEach(b => b.classList.toggle('sel', b === t)); return; }
    const l = side === 'l' ? k : L.mSel.k, r = side === 'r' ? k : L.mSel.k;
    const en = ex.left[l], es = ex.right[r];
    const lb = $(`#lbody [data-ml="${l}"]`), rb = $(`#lbody [data-mr="${r}"]`);
    if (ex.pairs.some(p => p[0] === en && p[1] === es)) {
      tone('ok'); [lb, rb].forEach(b => { b.classList.remove('sel'); b.classList.add('ok'); setTimeout(() => { b.classList.remove('ok'); b.classList.add('done'); }, 350); });
      L.matched.add(en); L.mSel = null;
      if (L.matched.size === ex.pairs.length) { L.checked = true; setTimeout(() => result(true, 'Uniste todas las parejas.'), 400); }
    } else {
      tone('no'); [lb, rb].forEach(b => { b.classList.remove('sel'); b.classList.add('no'); setTimeout(() => b.classList.remove('no'), 450); }); L.mSel = null;
    }
  }
});
document.addEventListener('keydown', e => {
  if (!L || $('#scrim')) return;
  const ex = cur();
  if (e.key === 'Enter' && !e.shiftKey) {
    const btn = $('#cont') || $('#finish') || $('#check');
    if (btn && !btn.disabled) { e.preventDefault(); btn.click(); }
    return;
  }
  if (!L.checked && ex && (ex.type === 'mc' || ex.type === 'pick') && /^[1-4]$/.test(e.key) && document.activeElement.tagName !== 'TEXTAREA') {
    const b = $(`#lbody [data-opt="${+e.key - 1}"]`); if (b) b.click();
  }
});

render();
})();
</script>

</body>
</html>
